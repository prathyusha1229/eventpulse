<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventPulse — Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #13162b;
      border-bottom: 1px solid #1e2340;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .logo { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    header .logo span { color: #818cf8; }
    .live-badge {
      background: #1e2a4a;
      color: #60a5fa;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .refresh-time { margin-left: auto; font-size: 11px; color: #475569; }

    /* ── Main ── */
    main { padding: 28px 32px; max-width: 1440px; margin: 0 auto; }

    /* ── Section labels ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      margin-top: 28px;
    }
    .section-label:first-child { margin-top: 0; }

    /* ── KPI Cards ── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 4px;
    }
    .kpi {
      background: #13162b;
      border: 1px solid #1e2340;
      border-radius: 14px;
      padding: 20px 22px;
      transition: border-color 0.2s;
    }
    .kpi:hover { border-color: #334155; }
    .kpi-label { font-size: 11px; color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
    .kpi-value { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
    .kpi-sub { font-size: 11px; color: #475569; margin-top: 6px; }
    .kpi.c-errors  .kpi-value { color: #f87171; }
    .kpi.c-views   .kpi-value { color: #818cf8; }
    .kpi.c-purchase .kpi-value { color: #34d399; }
    .kpi.c-signup  .kpi-value { color: #60a5fa; }

    /* ── Chart grid ── */
    .charts {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 4px;
    }
    @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }

    .card {
      background: #13162b;
      border: 1px solid #1e2340;
      border-radius: 14px;
      padding: 22px 24px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 20px;
    }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 8px 14px;
      border-bottom: 1px solid #1e2340;
    }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: #191d33; }
    tbody td {
      padding: 11px 14px;
      font-size: 13px;
      border-bottom: 1px solid #181b30;
      color: #cbd5e1;
    }
    tbody td:first-child { font-family: 'Courier New', monospace; color: #a5b4fc; font-size: 12px; }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill-error { background: #2d1515; color: #f87171; }
    .pill-ok    { color: #475569; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 64px 20px;
      color: #475569;
    }
    .empty h3 { font-size: 16px; font-weight: 600; color: #64748b; margin-bottom: 10px; }
    .empty p  { font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    .empty code {
      display: inline-block;
      background: #0d0f1a;
      border: 1px solid #1e2340;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      color: #818cf8;
      font-family: monospace;
    }
    .error-banner {
      background: #1f0f0f;
      border: 1px solid #3b1515;
      color: #f87171;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <span class="logo">Event<span>Pulse</span></span>
  <span class="live-badge"><span class="live-dot"></span>LIVE</span>
  <span class="refresh-time" id="last-update">Fetching data…</span>
</header>

<main>
  <div class="error-banner" id="error-banner"></div>

  <div class="section-label">Overview — last 7 days</div>
  <div class="kpis">
    <div class="kpi">
      <div class="kpi-label">Total Events</div>
      <div class="kpi-value" id="k-total">—</div>
      <div class="kpi-sub">All event types</div>
    </div>
    <div class="kpi c-errors">
      <div class="kpi-label">Errors</div>
      <div class="kpi-value" id="k-errors">—</div>
      <div class="kpi-sub">Error events tracked</div>
    </div>
    <div class="kpi c-views">
      <div class="kpi-label">Page Views</div>
      <div class="kpi-value" id="k-views">—</div>
      <div class="kpi-sub">Across all sessions</div>
    </div>
    <div class="kpi c-purchase">
      <div class="kpi-label">Purchases</div>
      <div class="kpi-value" id="k-purchases">—</div>
      <div class="kpi-sub">Revenue events</div>
    </div>
  </div>

  <div class="section-label">Activity breakdown</div>
  <div class="charts">
    <div class="card">
      <div class="card-title">Events per day</div>
      <canvas id="line-chart" height="110"></canvas>
    </div>
    <div class="card">
      <div class="card-title">By event type</div>
      <canvas id="donut-chart" height="200"></canvas>
    </div>
  </div>

  <div class="section-label">Top users</div>
  <div class="card" style="padding: 0; overflow: hidden;">
    <div id="users-container"></div>
  </div>
</main>

<script>
  const TYPE_COLORS = {
    page_view: '#818cf8',
    error:     '#f87171',
    signup:    '#60a5fa',
    purchase:  '#34d399',
  };
  const FALLBACK_COLORS = ['#a78bfa', '#fbbf24', '#fb923c', '#2dd4bf'];

  let lineChart  = null;
  let donutChart = null;

  function colorFor(type, idx) {
    return TYPE_COLORS[type] || FALLBACK_COLORS[idx % FALLBACK_COLORS.length];
  }

  function fmt(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
    return String(n);
  }

  async function load() {
    try {
      const [summary, usersData] = await Promise.all([
        fetch('/analytics/summary?days=7').then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); }),
        fetch('/analytics/users?days=7&limit=10').then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); }),
      ]);
      document.getElementById('error-banner').style.display = 'none';
      render(summary, usersData);
      document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      const banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent = 'Failed to load data: ' + err.message;
    }
  }

  function render(summary, usersData) {
    const bt = summary.by_type || {};
    document.getElementById('k-total').textContent     = fmt(summary.total_events || 0);
    document.getElementById('k-errors').textContent    = fmt(bt.error || 0);
    document.getElementById('k-views').textContent     = fmt(bt.page_view || 0);
    document.getElementById('k-purchases').textContent = fmt(bt.purchase || 0);

    renderLineChart(summary);
    renderDonut(bt);
    renderUsersTable(usersData.users || []);
  }

  function renderLineChart(summary) {
    const labels   = summary.daily.map(d => d.date.slice(5)); // MM-DD
    const types    = Object.keys(summary.by_type || {});
    const datasets = types.map((t, i) => ({
      label:           t,
      data:            summary.daily.map(d => d.by_type[t] || 0),
      borderColor:     colorFor(t, i),
      backgroundColor: colorFor(t, i) + '18',
      tension:         0.4,
      fill:            true,
      pointRadius:     3,
      pointHoverRadius: 5,
    }));

    const ctx = document.getElementById('line-chart').getContext('2d');
    if (lineChart) lineChart.destroy();
    lineChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#64748b', font: { size: 11 }, boxWidth: 12, padding: 16 } },
        },
        scales: {
          x: { ticks: { color: '#475569', font: { size: 11 } }, grid: { color: '#181b30' } },
          y: { ticks: { color: '#475569', font: { size: 11 } }, grid: { color: '#181b30' }, beginAtZero: true },
        },
      },
    });
  }

  function renderDonut(bt) {
    const types  = Object.keys(bt);
    const values = types.map(t => bt[t]);
    const ctx = document.getElementById('donut-chart').getContext('2d');
    if (donutChart) donutChart.destroy();

    if (!types.length) return;

    donutChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: types,
        datasets: [{
          data: values,
          backgroundColor: types.map((t, i) => colorFor(t, i)),
          borderColor: '#0d0f1a',
          borderWidth: 4,
          hoverOffset: 6,
        }],
      },
      options: {
        responsive: true,
        cutout: '68%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#64748b', font: { size: 11 }, padding: 16, boxWidth: 12 },
          },
        },
      },
    });
  }

  function renderUsersTable(users) {
    const container = document.getElementById('users-container');
    if (!users.length) {
      container.innerHTML = `
        <div class="empty">
          <h3>No analytics data yet</h3>
          <p>Run the seed script to generate sample data, then start the server.</p>
          <code>python scripts/seed_data.py</code>
        </div>`;
      return;
    }

    const rows = users.map(u => {
      const errs = u.by_type.error || 0;
      const errCell = errs > 0
        ? `<span class="pill pill-error">${errs}</span>`
        : `<span class="pill pill-ok">0</span>`;
      return `<tr>
        <td>${u.user_id}</td>
        <td>${u.total.toLocaleString()}</td>
        <td>${(u.by_type.page_view || 0).toLocaleString()}</td>
        <td>${errCell}</td>
        <td>${(u.by_type.purchase || 0).toLocaleString()}</td>
        <td>${(u.by_type.signup || 0).toLocaleString()}</td>
      </tr>`;
    }).join('');

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Total Events</th>
            <th>Page Views</th>
            <th>Errors</th>
            <th>Purchases</th>
            <th>Signups</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  load();
  setInterval(load, 30_000);
</script>

</body>
</html>
